<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.conteiner{
            background-color: chocolate;
            display: flex;
            flex-flow: row wrap;
        }

        div.item{
            background-color: darkgray;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;

           
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">A</div>
        <div class="item">A parte de hoje teremos pizza</div>
        <div class="item">A</div>
        <div class="item">Todas as estações estão em alerta</div>
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
    </div>
</body>
</html>
